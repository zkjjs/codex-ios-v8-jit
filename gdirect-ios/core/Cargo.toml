[package]
name = "gdirect-core"
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-or-later"

[lib]
crate-type = ["staticlib", "rlib"]

[features]
default = []
aria2 = []

[dependencies]
anyhow = "1"
scraper = "0.24"
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

[build-dependencies]
cc = "1"
