name: Build Codex Quota IPA

on:
  workflow_dispatch:
  push:
    branches: [codex-quota-ios]
    paths:
      - 'quota-ios/**'
      - '.github/workflows/build-codex-quota.yml'

permissions:
  contents: read

concurrency:
  group: codex-quota-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26 or later
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, os, plistlib, subprocess
          choices = []
          for path in glob.glob('/Applications/Xcode*.app'):
              with open(path + '/Contents/Info.plist', 'rb') as f:
                  version = plistlib.load(f)['CFBundleShortVersionString']
              numbers = tuple(int(n) for n in version.split('.') if n.isdigit())
              if numbers and numbers[0] >= 26:
                  choices.append((numbers, path))
          if not choices:
              raise SystemExit('Xcode 26+ required for native Liquid Glass')
          selected = max(choices)[1] + '/Contents/Developer'
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write('DEVELOPER_DIR=' + selected + '\n')
          print('Selected:', selected)
          PY
      - name: Install XcodeGen and generate project
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen generate --spec quota-ios/project.yml
      - name: Test backend
        run: python3 -m unittest discover -s quota-ios/backend/tests -v
      - name: Build device App and widget without signing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p quota-ios/out
          xcodebuild -project quota-ios/CodexQuota.xcodeproj -scheme CodexQuota \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath quota-ios/build-device CODE_SIGNING_ALLOWED=NO build \
            2>&1 | tee quota-ios/out/build.log
      - name: Test Swift models on simulator
        shell: bash
        run: |
          set -euo pipefail
          simulator_id="$(python3 - <<'PY'
          import json, subprocess
          devices = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'devices', 'available', '-j']))['devices']
          for runtime in sorted(devices, reverse=True):
              if 'iOS' not in runtime:
                  continue
              for device in devices[runtime]:
                  if device['name'].startswith('iPhone'):
                      print(device['udid'])
                      raise SystemExit(0)
          raise SystemExit('No iPhone simulator is installed')
          PY
          )"
          echo "QUOTA_SIMULATOR_ID=$simulator_id" >> "$GITHUB_ENV"
          xcodebuild -project quota-ios/CodexQuota.xcodeproj -scheme CodexQuota \
            -destination "platform=iOS Simulator,id=$simulator_id" \
            -derivedDataPath quota-ios/build-simulator -resultBundlePath quota-ios/out/Tests.xcresult \
            -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO test 2>&1 | tee quota-ios/out/tests.log
      - name: Package unsigned IPA
        run: bash quota-ios/scripts/package-ipa.sh quota-ios/build-device/Build/Products/Release-iphoneos/CodexQuota.app quota-ios/out
      - name: Capture simulator launch
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess
          simulator = os.environ['QUOTA_SIMULATOR_ID']
          devices = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'devices', '-j']))['devices']
          device = next(d for group in devices.values() for d in group if d['udid'] == simulator)
          if device['state'] != 'Booted':
              subprocess.run(['xcrun', 'simctl', 'boot', simulator], check=True)
          subprocess.run(['xcrun', 'simctl', 'bootstatus', simulator, '-b'], check=True)
          PY
          xcrun simctl install "$QUOTA_SIMULATOR_ID" quota-ios/build-simulator/Build/Products/Debug-iphonesimulator/CodexQuota.app
          xcrun simctl launch "$QUOTA_SIMULATOR_ID" com.zkjjs.codexquota
          sleep 3
          xcrun simctl io "$QUOTA_SIMULATOR_ID" screenshot quota-ios/out/Launch.png
      - uses: actions/upload-artifact@v4
        with:
          name: CodexQuota-unsigned-IPA
          path: |
            quota-ios/out/CodexQuota-unsigned.ipa
            quota-ios/out/SHA256SUMS
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CodexQuota-build-logs
          path: |
            quota-ios/out/*.log
            quota-ios/out/*.xcresult
            quota-ios/out/*.png
          if-no-files-found: ignore
