name: Codex Quota IPA
on:
  push:
    branches: ['build/codex-quota-20261025']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Test server bridge
        run: python3 -m unittest discover -s Server/tests -v
      - name: Test quota semantics
        run: swift test
      - name: Build IPA
        if: hashFiles('project.yml') != ''
        run: bash scripts/build.sh
        env:
          CAPTURE_UI: '0'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CodexQuota-build
          path: |
            dist/*
          if-no-files-found: ignore
