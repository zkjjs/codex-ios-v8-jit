name: Build gdirect iOS IPA
on:
  workflow_dispatch:
    inputs:
      google_client_id:
        description: 'Optional iOS OAuth client ID (public identifier, no client secret)'
        required: false
        type: string
      bundle_id:
        description: 'Bundle ID registered to the iOS OAuth client'
        required: false
        type: string
        default: org.gdirect.ios
  push:
    branches:
      - 'codex/ios-build/**'
permissions:
  contents: read
concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    working-directory: gdirect-ios
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: python3 -m unittest discover -s Tests -p 'test_*.py' -v
      - name: Test repeated native download sessions
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libaria2-0-dev g++
          g++ -std=c++11 -pthread Tests/native/repeated_download.cc native/bridge.cc -laria2 -o /tmp/gdirect-native-regression
          /tmp/gdirect-native-regression
      - run: cargo test --manifest-path core/Cargo.toml --locked
  ipa:
    runs-on: xcode-27
    timeout-minutes: 60
    needs: core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check Xcode SDK
        id: toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks
          sdk_version="$(xcrun --sdk iphoneos --show-sdk-version)"
          echo "sdk=$sdk_version" >> "$GITHUB_OUTPUT"
          echo "rust=$(rustc --version | shasum -a 256 | cut -c1-16)" >> "$GITHUB_OUTPUT"
          test "${sdk_version%%.*}" -ge 27 || { echo "Select a runner with Xcode/iOS SDK 27 or newer."; exit 1; }
      - name: Test Swift support
        run: swift test --package-path .
      - run: brew install xcodegen
      - uses: actions/cache/restore@v4
        id: native-cache
        with:
          path: gdirect-ios/build/GDirectCore.xcframework
          key: gdirect-native-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.sdk }}-${{ steps.toolchain.outputs.rust }}-${{ hashFiles('gdirect-ios/core/Cargo.toml', 'gdirect-ios/core/Cargo.lock', 'gdirect-ios/core/build.rs', 'gdirect-ios/core/default-endpoints.json', 'gdirect-ios/core/src/**', 'gdirect-ios/native/**', 'gdirect-ios/vendor/**', 'gdirect-ios/scripts/build-ios-core.sh') }}
      - name: Compile unsigned IPA
        env:
          GDIRECT_GOOGLE_CLIENT_ID: ${{ inputs.google_client_id || vars.GDIRECT_GOOGLE_CLIENT_ID }}
          GDIRECT_BUNDLE_ID: ${{ inputs.bundle_id || vars.GDIRECT_BUNDLE_ID || 'org.gdirect.ios' }}
          GDIRECT_USE_CACHED_CORE: ${{ steps.native-cache.outputs.cache-hit == 'true' && '1' || '0' }}
        run: |
          set -o pipefail
          ./scripts/build-unsigned-ipa.sh 2>&1 | tee ios-build.log
      - uses: actions/upload-artifact@v4
        with:
          name: GDirect-unsigned-ipa
          path: gdirect-ios/build/GDirect-unsigned.ipa
          if-no-files-found: error
      - name: Preserve native debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: native-debug-symbols
          path: |
            gdirect-ios/build/**/*.dSYM
            gdirect-ios/build/*.map
          if-no-files-found: warn
      - name: Run iOS storage and recovery tests
        timeout-minutes: 15
        run: |
          set -o pipefail
          ./scripts/test-ios.sh 2>&1 | tee ios-test.log
      - name: Preserve test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: |
            gdirect-ios/ios-test.log
            gdirect-ios/build/GDirectTests.xcresult
          if-no-files-found: ignore
      - name: Preserve compiler logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          path: gdirect-ios/ios-build.log
          if-no-files-found: ignore
      - name: Cache compiled native core
        if: always() && steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: gdirect-ios/build/GDirectCore.xcframework
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
