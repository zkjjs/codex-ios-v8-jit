name: Build SideInstaller GSA 503 + 429 Fix

on:
  push:
    paths:
      - ".github/workflows/build-sideinstaller-gsa503-fix.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Checkout SideInstaller v0.9.0
        uses: actions/checkout@v4
        with:
          repository: FrizzleM/SideInstaller
          ref: v0.9.0
          fetch-depth: 1

      - name: Patch Apple GSA 503 client info
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("rust-core/vendor/isideload/src/anisette/remote_v3/mod.rs")
          s = p.read_text()
          old1 = "                let resp = self\n                    .client\n                    .get(format!(\"{}/v3/client_info\", self.url))"
          new1 = "                let mut resp = self\n                    .client\n                    .get(format!(\"{}/v3/client_info\", self.url))"
          if old1 not in s:
              raise SystemExit("Could not locate v0.9.0 client_info request")
          s = s.replace(old1, new1, 1)
          marker = "                self.client_info = Some(resp.clone());"
          patch = "                // Apple GSA rejects X-Mme-Client-Info values identifying Xcode.\n                // Preserve server metadata, but normalize the blocked client token.\n                if let Some(start) = resp.client_info.find(\"(com.apple.dt.Xcode/\") {\n                    if let Some(rel_end) = resp.client_info[start..].find(')') {\n                        let end = start + rel_end + 1;\n                        resp.client_info.replace_range(start..end, \"(com.apple.akd/1.0)\");\n                    }\n                }\n\n"
          if marker not in s:
              raise SystemExit("Could not locate v0.9.0 client_info assignment")
          s = s.replace(marker, patch + marker, 1)
          p.write_text(s)
          print("Patched:", p)
          PY
          grep -n -A10 -B3 "com.apple.akd" rust-core/vendor/isideload/src/anisette/remote_v3/mod.rs

      - name: Stop anisette rotation when Apple returns HTTP 429
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("ios-app/CertManager.swift")
          s = p.read_text()

          needle = '''                if Engine.isCredentialError(lastError) {
                    engine.log("Apple ID credentials rejected: \(lastError)")
                    throw EngineError.message(Engine.credentialErrorMessage)
                }
                engine.log("Certificates: anisette \(idx + 1)/\(servers.count) failed: \(lastError)")
'''
          replacement = '''                if Engine.isCredentialError(lastError) {
                    engine.log("Apple ID credentials rejected: \(lastError)")
                    throw EngineError.message(Engine.credentialErrorMessage)
                }
                // A GrandSlam 429 is Apple's rate limiter, not an anisette-server
                // failure. Rotating through every server only repeats the same
                // Apple-ID login and can extend the cooldown.
                if lastError.localizedCaseInsensitiveContains("429") ||
                   lastError.localizedCaseInsensitiveContains("Too Many Requests") {
                    engine.log("Apple rate limit hit (HTTP 429) — stopping anisette rotation.")
                    throw EngineError.message(
                        L("Apple is temporarily rate-limiting sign-in (HTTP 429). SideInstaller stopped automatic retries. Wait a while, then try once.")
                    )
                }
                engine.log("Certificates: anisette \(idx + 1)/\(servers.count) failed: \(lastError)")
'''
          if needle not in s:
              raise SystemExit("Could not locate CertManager retry block")
          p.write_text(s.replace(needle, replacement, 1))
          print("Patched:", p)
          PY
          grep -n -A14 -B4 "Apple rate limit hit" ios-app/CertManager.swift

      - name: Show toolchain
        shell: bash
        run: |
          xcodebuild -version
          swift --version
          rustc --version
          cargo --version

      - name: Install build dependencies
        shell: bash
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim

      - name: Build Rust core
        shell: bash
        run: |
          chmod +x build-rust.sh
          DEVELOPER_DIR="$(xcode-select -p)" ./build-rust.sh

      - name: Generate Xcode project
        shell: bash
        run: xcodegen generate

      - name: Build unsigned iPhone app
        shell: bash
        run: |
          rm -rf build
          xcodebuild \
            -project SideInstaller.xcodeproj \
            -scheme SideInstaller \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build
          APP="build/DerivedData/Build/Products/Release-iphoneos/SideInstaller.app"
          test -d "$APP"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP" Payload/SideInstaller.app
          /usr/bin/zip -qry SideInstaller-0.9.0-GSA503-429-Fixed-unsigned.ipa Payload
          shasum -a 256 SideInstaller-0.9.0-GSA503-429-Fixed-unsigned.ipa

      - name: Upload patched IPA
        uses: actions/upload-artifact@v4
        with:
          name: SideInstaller-0.9.0-GSA503-429-Fixed-unsigned
          path: SideInstaller-0.9.0-GSA503-429-Fixed-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
