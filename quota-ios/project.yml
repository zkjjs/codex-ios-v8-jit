name: CodexQuota
options:
  bundleIdPrefix: com.zkjjs
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  CodexQuota:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zkjjs.codexquota
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Generated/App-Info.plist
      properties:
        CFBundleDisplayName: Codex 额度
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleURLName: com.zkjjs.codexquota
            CFBundleURLSchemes: [codexquota]
    entitlements:
      path: Generated/App.entitlements
      properties:
        com.apple.security.application-groups: [group.com.zkjjs.codexquota]
    dependencies:
      - target: CodexQuotaWidget
        embed: true
  CodexQuotaWidget:
    type: app-extension
    platform: iOS
    sources:
      - Widget
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zkjjs.codexquota.widget
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    info:
      path: Generated/Widget-Info.plist
      properties:
        CFBundleDisplayName: Codex 额度小组件
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Generated/Widget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.zkjjs.codexquota]
  CodexQuotaTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: CodexQuota
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  CodexQuota:
    build:
      targets:
        CodexQuota: all
    test:
      targets: [CodexQuotaTests]
