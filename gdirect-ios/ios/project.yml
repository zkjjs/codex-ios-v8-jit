name: GDirect
options:
  bundleIdPrefix: org.gdirect
  deploymentTarget:
    iOS: "27.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "27.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    TARGETED_DEVICE_FAMILY: "1,2"
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig
packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    exactVersion: 10.1.0
targets:
  GDirect:
    type: application
    platform: iOS
    sources:
      - path: GDirect
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(GDIRECT_BUNDLE_ID)
        SWIFT_OBJC_BRIDGING_HEADER: GDirect/App/GDirect-Bridging-Header.h
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: GDirect/App/Info.plist
        MARKETING_VERSION: "0.2.2"
        CURRENT_PROJECT_VERSION: "4"
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_GENERATE_MAP_FILE: YES
        LD_MAP_FILE_PATH: $(PROJECT_DIR)/../build/GDirect-$(CONFIGURATION)-$(PLATFORM_NAME)-$(CURRENT_ARCH).map
    dependencies:
      - framework: ../build/GDirectCore.xcframework
        embed: false
      - package: GoogleSignIn
        product: GoogleSignIn
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework
      - sdk: CoreFoundation.framework
      - sdk: libc++.tbd
      - sdk: libsqlite3.tbd
  GDirectTests:
    type: bundle.unit-test
    platform: iOS
    sources: [GDirectTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: GDirect
schemes:
  GDirect:
    build:
      targets:
        GDirect: all
    test:
      targets: [GDirectTests]
